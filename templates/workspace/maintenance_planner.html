{% load static %}
<dialog id="cm-planner" class="cm-dialog" aria-labelledby="cm-title"
        data-schedule-url="{% url 'schedule_classroom_maintenance' %}"
        data-reason-url="{% url 'classroom_maintenance_reason' %}">
    <header class="cm-dialog-head"><h2 id="cm-title">Maintenance Details</h2></header>
    <form id="cm-form">
        {% csrf_token %}
        <div id="cm-target"></div>
        <details id="cm-edit-rooms" hidden>
            <summary>Edit classrooms</summary>
            <fieldset id="cm-room-choices"><legend>Classrooms in this building</legend></fieldset>
        </details>
        <div id="cm-selected-schedule"></div>
        <details id="cm-edit-schedule" hidden>
            <summary>Edit dates and times</summary>
            <div class="cm-fields" id="cm-recurrence" hidden>
                <label>Repeat from<input name="start_date" type="date"></label>
                <label>Repeat until<input name="end_date" type="date"></label>
            </div>
            <div id="cm-selections"></div>
            <button type="button" id="cm-add-window">Add date or time</button>
        </details>
        <label>Reason for Maintenance
            <select name="reason" required><option value="">Choose a reason</option>
                {% for reason in maintenance_reasons %}<option value="{{ reason }}">{{ reason }}</option>{% endfor %}
            </select>
        </label>
        <button type="button" id="cm-new-reason">+ Add Reason</button>
        <div class="cm-fields">
            <label>Start Date &amp; Time <input name="starts_at" type="datetime-local" required></label>
            <label>Expected Completion Date &amp; Time <input name="expected_completion" type="datetime-local" required></label>
        </div>
        <label>Description <textarea name="description" maxlength="5000" rows="2"></textarea></label>
        <p id="cm-error" role="alert" hidden></p>
        <div class="cm-selection-actions cm-form-actions">
            <button type="button" data-cm-back>Back</button>
            <button type="button" data-cm-close>Cancel</button>
            <button type="submit" class="cm-primary">Review &amp; Submit</button>
        </div>
    </form>
</dialog>
<script defer src="{% static 'js/classroom_maintenance.js' %}?v=selection-23"></script>
