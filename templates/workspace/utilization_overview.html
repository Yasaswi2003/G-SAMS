<section class="ref-metrics" aria-label="Class utilization summary">
  <article class="ref-metric"><span class="ref-icon"><i class="bx bx-buildings"></i></span><div><p>Total Classrooms</p><strong>{{ design_summary.rooms }}</strong><small>Active rooms in selected scope</small></div></article>
  <article class="ref-metric"><span class="ref-icon"><i class="bx bx-bar-chart-alt-2"></i></span><div><p>Avg Utilization</p><strong>{{ design_summary.utilization }}%</strong><small>Classes and confirmed bookings</small></div></article>
  <article class="ref-metric"><span class="ref-icon ref-icon-gold"><i class="bx bx-time-five"></i></span><div><p>Peak Hour</p><strong class="ref-time">{{ design_summary.peak }}</strong><small>Highest classroom usage</small></div></article>
  <article class="ref-metric"><span class="ref-icon"><i class="bx bx-door-open"></i></span><div><p>Idle Rooms</p><strong>{{ design_summary.idle }}</strong><small>No scheduled use in this view</small></div></article>
</section>
